<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients d'Orfèvrerie Dahomey -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C78A"/>
      <stop offset="45%" stop-color="#C5A365"/>
      <stop offset="80%" stop-color="#9E7A3E"/>
      <stop offset="100%" stop-color="#C5A365"/>
    </linearGradient>

    <linearGradient id="forestGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26523D"/>
      <stop offset="100%" stop-color="#1B3B2B"/>
    </linearGradient>

    <!-- Ombre Portée Subtile -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond Transparent avec Cercle de Centrage -->
  <g id="outer-crest" filter="url(#softGlow)">
    <!-- Anneau Extérieur Double-Bezel -->
    <circle cx="250" cy="250" r="236" stroke="url(#goldGradient)" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.65" />
    <circle cx="250" cy="250" r="226" stroke="url(#goldGradient)" stroke-width="2.5" />
    <circle cx="250" cy="250" r="218" stroke="#1B3B2B" stroke-width="1.2" opacity="0.45" />

    <!-- 8 Points Cardinaux / Étoiles Dahomey -->
    <circle cx="250" cy="28" r="3.5" fill="url(#goldGradient)" />
    <circle cx="250" cy="472" r="3.5" fill="url(#goldGradient)" />
    <circle cx="28" cy="250" r="3.5" fill="url(#goldGradient)" />
    <circle cx="472" cy="250" r="3.5" fill="url(#goldGradient)" />
  </g>

  <!-- Couronne Botanique / Feuilles de Palmier de Ouidah -->
  <g id="botanical-wreath" stroke="url(#goldGradient)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Branche Gauche -->
    <path d="M 120 340 C 95 280, 100 200, 145 140 C 170 106, 210 80, 240 70" opacity="0.85" />
    <path d="M 108 300 Q 88 285 96 265 Q 112 280 114 295" fill="url(#goldGradient)" fill-opacity="0.15" />
    <path d="M 104 250 Q 82 235 94 215 Q 110 230 112 245" fill="url(#goldGradient)" fill-opacity="0.15" />
    <path d="M 112 200 Q 94 185 108 165 Q 124 180 122 195" fill="url(#goldGradient)" fill-opacity="0.15" />
    <path d="M 132 155 Q 118 138 136 122 Q 148 138 142 152" fill="url(#goldGradient)" fill-opacity="0.15" />
    <path d="M 165 118 Q 155 100 176 88 Q 184 106 174 118" fill="url(#goldGradient)" fill-opacity="0.15" />
    <path d="M 205 90 Q 200 72 224 65 Q 228 84 214 92" fill="url(#goldGradient)" fill-opacity="0.15" />

    <!-- Branche Droite -->
    <path d="M 380 340 C 405 280, 400 200, 355 140 C 330 106, 290 80, 260 70" opacity="0.85" />
    <path d="M 392 300 Q 412 285 404 265 Q 388 280 386 295" fill="url(#goldGradient)" fill-opacity="0.15" />
    <path d="M 396 250 Q 418 235 406 215 Q 390 230 388 245" fill="url(#goldGradient)" fill-opacity="0.15" />
    <path d="M 388 200 Q 406 185 392 165 Q 376 180 378 195" fill="url(#goldGradient)" fill-opacity="0.15" />
    <path d="M 368 155 Q 382 138 364 122 Q 352 138 358 152" fill="url(#goldGradient)" fill-opacity="0.15" />
    <path d="M 335 118 Q 345 100 324 88 Q 316 106 326 118" fill="url(#goldGradient)" fill-opacity="0.15" />
    <path d="M 295 90 Q 300 72 276 65 Q 272 84 286 92" fill="url(#goldGradient)" fill-opacity="0.15" />

    <!-- Ruban de Liaison à la Base -->
    <path d="M 215 365 C 235 375, 265 375, 285 365" stroke-width="2.5" />
    <circle cx="250" cy="370" r="5" fill="url(#goldGradient)" />
  </g>

  <!-- Étoile Solaire Dahomey au Sommet -->
  <g id="apex-star" fill="url(#goldGradient)">
    <path d="M 250 48 L 253 62 L 267 65 L 253 68 L 250 82 L 247 68 L 233 65 L 247 62 Z" />
    <circle cx="250" cy="65" r="2" fill="#FAF8F5" />
  </g>

  <!-- MONOGRAMME MA MAJESTUEUX ENTRELACÉ -->
  <g id="monogram-core">
    <!-- LETTRE "M" (GÉOMÉTRIE ROYALE AVEC EMPATTEMENTS PRÉCIEUX) -->
    <!-- Fût Gauche M -->
    <path d="M 148 335 L 148 165 L 168 165 L 168 335 Z" fill="url(#goldGradient)" />
    <!-- Serifs Gauche M -->
    <path d="M 136 165 L 178 165 L 178 171 L 136 171 Z" fill="url(#goldGradient)" />
    <path d="M 136 329 L 180 329 L 180 335 L 136 335 Z" fill="url(#goldGradient)" />

    <!-- Diagonale Descendante Gauche M -->
    <path d="M 166 165 L 250 290 L 234 290 L 152 170 Z" fill="url(#goldGradient)" />

    <!-- Diagonale Montante Droite M -->
    <path d="M 334 165 L 250 290 L 266 290 L 348 170 Z" fill="url(#goldGradient)" />

    <!-- Fût Droit M -->
    <path d="M 332 165 L 352 165 L 352 335 L 332 335 Z" fill="url(#goldGradient)" />
    <!-- Serifs Droit M -->
    <path d="M 322 165 L 364 165 L 364 171 L 322 171 Z" fill="url(#goldGradient)" />
    <path d="M 320 329 L 364 329 L 364 335 L 320 335 Z" fill="url(#goldGradient)" />

    <!-- LETTRE "A" ENTRELACÉE EN FORESTS GREEN & GOLD (HAUTE PRÉCISION) -->
    <!-- Jambage Gauche A -->
    <path d="M 250 142 L 180 335 L 198 335 L 250 188 L 302 335 L 320 335 Z" 
          fill="#1B3B2B" stroke="url(#goldGradient)" stroke-width="1.2" />

    <!-- Sommet A : Apex avec empattement royal -->
    <path d="M 238 145 L 262 145 L 250 134 Z" fill="url(#goldGradient)" />

    <!-- Traverse Horizontale A (Barre de liaison or) -->
    <rect x="210" y="260" width="80" height="8" rx="2" fill="url(#goldGradient)" />
    <circle cx="250" cy="264" r="2.5" fill="#1B3B2B" />

    <!-- Petit Losange Cérémonial au Centre du M/A -->
    <polygon points="250,210 256,220 250,230 244,220" fill="url(#goldGradient)" />
  </g>

  <!-- Ligne Signature Inférieure -->
  <g id="bottom-seal" text-anchor="middle" font-family="'Cinzel', Georgia, serif">
    <text x="250" y="415" font-size="13" letter-spacing="0.32em" fill="url(#goldGradient)" font-weight="600">MAISON ADÉNIKÈ</text>
    <text x="250" y="435" font-size="9" letter-spacing="0.4em" fill="#1B3B2B" font-weight="700">OUIDAH</text>
  </g>
</svg>
